# litellm proxy config — DB-less. Fronts agy (primary), on-demand local ollama,
# and an optional cloud fallback. Loaded by the container at /app/config.yaml.
#
# Routing is steered by handlers/routing_hook.py (registered under
# litellm_settings.callbacks): by default every request is redirected to `agy`;
# an explicit `ollama-local` request triggers on-demand ollama warm-up via the
# deployed controller, falling back to `cloud` if warm-up fails.

model_list:
  # primary: custom provider -> agy gateway (see handlers/agy_handler.py)
  - model_name: agy
    litellm_params:
      model: "agy/default"

  # on-demand local model served by ollama on the desktop host
  - model_name: ollama-local
    litellm_params:
      model: "ollama_chat/qwen3-vl:8b"
      api_base: "http://host.docker.internal:11434"

  # cli-gateways (LXC 108/109): opencode + claude-code as HTTP backends
  # (see handlers/cli_gateway_handler.py; text-only, no tools/images)
  - model_name: opencode
    litellm_params:
      model: "opencode/default"

  - model_name: claude-code
    litellm_params:
      model: "claudecode/default"

  # optional cloud fallback — keyless is OK: unused until ANTHROPIC_API_KEY is set
  - model_name: cloud
    litellm_params:
      model: "anthropic/claude-sonnet-4-5"
      api_key: "os.environ/ANTHROPIC_API_KEY"

litellm_settings:
  # register the CustomLLM instances for the custom providers
  custom_provider_map:
    - provider: agy
      custom_handler: handlers.agy_handler.agy_llm
    - provider: opencode
      custom_handler: handlers.opencode_handler.opencode_llm
    - provider: claudecode
      custom_handler: handlers.claudecode_handler.claudecode_llm
  # OTel export + the pre-call routing hook instance
  # `otel` (U10) exports TRACES via OTLP — but the lab logging stack is Loki
  # (logs only, no Tempo/traces backend), so it's disabled until one exists.
  # Re-add "otel" + set OTEL_ENDPOINT once a traces backend is deployed.
  callbacks: ["handlers.routing_hook.hook_instance"]
  set_verbose: false
  # model-level fallbacks: agy -> cloud, ollama-local -> agy, cli-gateways -> cloud
  fallbacks:
    - agy: ["cloud"]
    - ollama-local: ["agy"]
    - opencode: ["cloud"]
    - claude-code: ["cloud"]
  num_retries: 2
  request_timeout: 120

router_settings:
  cooldown_time: 30
  allowed_fails: 3
  routing_strategy: simple-shuffle
