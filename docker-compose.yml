# DB-less litellm proxy on :4000 fronting agy / ollama-local / cloud.
# Start:  docker compose up -d      Logs:  docker compose logs -f
services:
  litellm:
    image: docker.litellm.ai/berriai/litellm:main-stable
    container_name: litellm-router
    restart: unless-stopped
    ports:
      - "4000:4000"
    # --config points at the mounted file; no --database_url == DB-less mode
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    env_file:
      - .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./handlers:/app/handlers:ro
    # lets host.docker.internal (ollama on :11434, the controller on :8765)
    # resolve on Linux hosts too
    extra_hosts:
      - "host.docker.internal:host-gateway"
